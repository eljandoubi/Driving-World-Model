[project]
name = "driving-world-model"
version = "0.1.0"
description = "A world model for autonomous driving: next-frame prediction conditioned on actions via a Stable Diffusion UNet"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "diffusers>=0.37.1",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=5.8.1",
    "wandb>=0.27.0",
]

[project.urls]
Repository = "https://github.com/eljandoubi/driving-world-model"
Issues = "https://github.com/eljandoubi/driving-world-model/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driving_world_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

